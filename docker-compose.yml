version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: inventory_postgres_db
    environment:
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_password
      POSTGRES_DB: inventory_db
    ports:
      - "5432:5432"
    volumes:
      - ./db/init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      
  warehouseinventoryservice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warehouse_inventory_service
    depends_on:
      - postgres
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=postgres;Port=5432;Database=inventory_db;User Id=inventory_user;Password=inventory_password;
    ports:
      - "5000:80" # Map internal port 8081 to host port 5000    
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5